name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch + torchvision
        # Both must come from the same CPU-only index: a torchvision wheel
        # resolved from a different index than torch (e.g. plain PyPI) can
        # be built against a different libtorch ABI, which timm's import
        # of torchvision.models.feature_extraction then fails on with
        # "RuntimeError: operator torchvision::nms does not exist".
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest -v
