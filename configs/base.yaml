# Real-scale config: pretrained ViT-B/16 image encoder + BERT-base text
# encoder. Requires a GPU and internet access (to download the ViT-B/16 and
# bert-base-uncased pretrained weights on first use). Not exercised by CI.
seed: 42
device: cuda

data:
  n_train: 20000
  n_val: 2000
  n_test: 2000
  grid_rows: 4
  grid_cols: 4
  max_reports: 32
  max_report_tokens: 64
  max_sitrep_tokens: 96
  vocab_size: 30000
  prob_zero_reports: 0.2
  prob_distractor: 0.25

model:
  image_variant: vit_b16
  text_variant: bert
  shared_dim: 256
  private_dim: 128
  decoder_base_channels: 128
  modality_dropout_p: 0.3
  d_model: 512
  n_enc_layers: 4
  n_dec_layers: 4
  n_heads: 8
  ffn_dim: 2048

loss1:
  lambda_r: 1.0
  lambda_c: 0.5
  lambda_orth: 0.1
  lambda_n: 0.5
  tau: 0.07

loss2:
  lambda_d: 1.0
  lambda_b: 1.0
  lambda_g: 0.1

train:
  batch_size: 32
  epochs_stage1: 20
  epochs_stage2: 20
  epochs_stage3: 10
  lr_stage1: 0.0003
  lr_stage2: 0.0003
  lr_stage3: 0.00003
  num_workers: 4

checkpoints:
  dir: runs/base
